apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-triage-service
  labels:
    app: ai-triage-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-triage-service
  template:
    metadata:
      labels:
        app: ai-triage-service
    spec:
      containers:
        - name: ai-triage-service
          image: image-registry.openshift-image-registry.svc:5000/sandbox-shared-models/ai-triage-service:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-triage-service
  labels:
    app: ai-triage-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: ai-triage-service
