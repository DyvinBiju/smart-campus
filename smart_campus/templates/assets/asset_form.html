{% extends "base.html" %}

{% block title %}
Asset Form
{% endblock title %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">
        {% if object %}
            Edit Asset
        {% else %}
            Add Asset
        {% endif %}
    </h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success">
            Save
        </button>

        <a href="{% url 'assets:asset_list' %}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock content %}
