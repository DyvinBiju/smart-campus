{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block title %}
  Update Profile: {{ user.username }} - SmartCampus
{% endblock title %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-primary text-white py-3" style="background: linear-gradient(135deg, #1e3a8a, #3b82f6) !important;">
          <h4 class="card-title mb-0 text-white fw-bold"><i class="fa-solid fa-user-pen me-2"></i>Update Profile Details</h4>
        </div>
        <div class="card-body p-4">
          <form class="form-horizontal" method="post" action="{% url 'users:update' %}">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-flex justify-content-between align-items-center mt-4">
              <a href="{% url 'users:detail' request.user.username %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
              <button type="submit" class="btn btn-primary rounded-pill px-4"><i class="fa-solid fa-floppy-disk me-2"></i>Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
