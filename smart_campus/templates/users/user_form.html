{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}
  Update Profile: {{ user.username }} - SmartCampus
{% endblock title %}

{% block content %}
<div class="user-form-container">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-white p-4 border-bottom">
          <h4 class="fw-bold text-dark mb-1"><i class="fa-solid fa-user-pen text-primary me-2"></i>Update Profile</h4>
          <small class="text-muted">Modify account details for {{ user.username }}</small>
        </div>

        <div class="card-body p-4 p-md-5">
          <form class="form-horizontal" method="post" action="{% url 'users:update' %}">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
              <a href="{% url 'users:detail' request.user.username %}" class="btn btn-light border px-4 py-2 text-secondary fw-semibold">
                Cancel
              </a>
              <button type="submit" class="btn btn_one px-4 py-2 text-white fw-semibold">
                <i class="fa-solid fa-floppy-disk me-1"></i> Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
